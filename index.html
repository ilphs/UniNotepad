<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniNotepad</title>
  </head>
  <body>
    <div id="app">
      <div id="tabrow">
        <div id="tabbar"></div>
        <button id="tab-new" type="button" title="New Tab" aria-label="New Tab">+</button>
      </div>
      <div id="banner"></div>
      <div id="split">
        <div id="editor-host">
          <button id="editor-close" class="pane-close" type="button" hidden
                  title="Close Editor" aria-label="Close Editor">&times;</button>
        </div>
        <div id="divider" hidden></div>
        <div id="preview-host" hidden></div>
        <!-- Outside #preview-host on purpose: that pane scrolls, and its
             children are replaced wholesale on the first render. -->
        <button id="preview-close" class="pane-close" type="button" hidden
                title="Close Preview" aria-label="Close Preview">&times;</button>
      </div>
      <div id="statusbar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
